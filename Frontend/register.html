<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สมัครสมาชิก</title>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <div class="login-box">
    <div class="logo">♛</div>

    <h2>สมัครสมาชิก</h2>

    <input id="regUser" placeholder="Username">
    <input id="regPass" type="password" placeholder="Password">
    <input id="regPass2" type="password" placeholder="Confirm Password">

    <button onclick="register()">สมัครสมาชิก</button>

    <div class="login-footer">
      มีบัญชีแล้ว? 
            <a href="login.html" class="register-btn">เข้าสู่ระบบ</a>
    </div>
  </div>

  <script>
    function register() {
      const user = document.getElementById("regUser").value;
      const pass = document.getElementById("regPass").value;
      const pass2 = document.getElementById("regPass2").value;

      if (!user || !pass) {
        alert("กรอกข้อมูลให้ครบ");
        return;
      }

      if (pass !== pass2) {
        alert("รหัสผ่านไม่ตรงกัน");
        return;
      }

      // เก็บ user ลง localStorage
      const users = JSON.parse(localStorage.getItem("users")) || [];

      const exists = users.find(u => u.username === user);
      if (exists) {
        alert("Username นี้มีแล้ว");
        return;
      }

      users.push({ username: user, password: pass });
      localStorage.setItem("users", JSON.stringify(users));

      alert("สมัครสมาชิกสำเร็จ");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
