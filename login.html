<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ | Golden AI</title>

    <!-- ฟอนต์ -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun&family=Cinzel:wght@600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-box">
        <div class="logo">♛</div>

        <h2>เข้าสู่ระบบ</h2>

        <input id="user" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">

        <button class="login-btn" onclick="login()">เข้าสู่ระบบ</button>

        <div class="login-footer">
            ยังไม่มีบัญชี?
            <a href="register.html" class="register-btn">สมัครสมาชิก</a>
        </div>
        <div class="login-footer">
            Golden AI ✦ ระบบผู้ช่วยทองคำ
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById("user").value;
            const pass = document.getElementById("pass").value;

            const users = JSON.parse(localStorage.getItem("users")) || [];

            const found = users.find(u => u.username === user && u.password === pass);

            if (!found) {
                alert("Username หรือ Password ไม่ถูกต้อง");
                return;
            }

            // login สำเร็จ
            localStorage.setItem("username", user);

            window.location.href = "index.html";
        }
    </script>
</body>

</html>
